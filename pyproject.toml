[tool.poetry]
name = "convo-filter"
version = "0.1.0"
description = "A tool to filter PDF conversations by topic using Claude AI"
authors = ["James Cranston"]
readme = "README.md"
packages = [{include = "convo_filter"}]

[tool.poetry.dependencies]
python = "^3.10"
anthropic = "^0.52.2"
pypdf = "^4.0.1"
reportlab = "^4.4.1"
click = "^8.1.7"
rich = "^13.7.0"
pydantic = "^2.6.1"
pre-commit = "3.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.12.1"
isort = "^5.13.2"
mypy = "^1.8.0"
ruff = "^0.2.1"
pre-commit = "^3.6.0"
types-reportlab = "^4.4.1.20250602"

[tool.poetry.scripts]
convo-filter = "convo_filter.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["convo_filter/tests"]
python_files = ["test_*.py"]
addopts = "--cov=convo_filter --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["convo_filter"]
